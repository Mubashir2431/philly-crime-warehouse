[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phl-crime"
version = "0.1.0"
description = "ETL pipeline and star-schema warehouse for Philadelphia crime incidents"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mubashir Panjwani" }]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
dashboard = ["streamlit>=1.38", "plotly>=5.22"]
screenshots = ["playwright>=1.45"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
